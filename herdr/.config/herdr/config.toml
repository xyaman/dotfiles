# Mirrors ~/.tmux.conf bindings. Stowed from ~/dotfiles/herdr/.
# Only binds what differs from herdr's defaults.

[theme]
# "terminal" = host palette, closest to tmux's ghostty theming.
name = "terminal"

[keys]
# tmux: set-option -g prefix C-a
prefix = "ctrl+a"

# tmux: bind f resize-pane -Z
zoom = "prefix+f"

# tmux: bind r source-file ~/.tmux.conf
reload_config = "prefix+r"

# tmux: bind '%' split-window -h
split_horizontal = "prefix+percent"

# tmux: bind '"' split-window -v
split_vertical = "prefix+double_quote"

# tmux: bind S-Left/Right swap-window
move_tab_previous = "prefix+shift+left"
move_tab_next = "prefix+shift+right"
