##### PREFIX REMAP #####
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

##### PANE ZOOM #####
unbind-key z
bind f resize-pane -Z  # Toggle zoom with f

##### GENERAL SETTINGS #####
set -g mouse on
set -g history-limit 10000
set -g base-index 1                  # Windows start at 1

set -g renumber-windows on          # Renumber windows when one is closed
set -sg escape-time 0
set -g status-interval 5            # Status bar update interval
set-environment -g 'IGNOREEOF' 1
set-option -wg monitor-activity on  # Monitor window activity
set -g extended-keys on

##### GHOSTTY DEFAULT THEME #####
# Panes
set -g pane-border-lines single
set -g pane-border-style "fg=#666666"
set -g pane-active-border-style "fg=#7aa6da bg=default"
set -g pane-border-status off

# Popups & menus (tmux 3.4+)
set -g popup-border-lines rounded
set -g popup-border-style "fg=#7aa6da bg=#282c34"
set -g menu-border-lines rounded
set -g menu-border-style "fg=#666666 bg=#282c34"
set -g menu-style "fg=#c5c8c6 bg=#282c34"

# Messages
set -g message-style "fg=#ffffff bg=#282c34 bold"
set -g message-command-style "fg=#ffffff bg=#282c34 bold"

# Clock
set -g clock-mode-colour "#c5c8c6"
set -g clock-mode-style 24

set-option -g focus-events on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g allow-passthrough on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides "*:Tc"
set -ga terminal-overrides ",alacritty:RGB"
set -ga terminal-features ",alacritty:usstyle"

##### RELOAD CONFIG #####
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

##### VI COPY MODE #####
set-window-option -g mode-keys vi
bind -T copy-mode-vi : run "tmux split-window -h -l 3 -b 'while [ \$SECONDS -lt 10 ]; do seq $(tput lines) -1 1; sleep 1; clear; done'; tmux last-pane; sleep 0.15" \; command-prompt -p "Go to line:" "send-keys -X goto-line %%;"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-pipe "xclip -in -selection clipboard" \; send -X clear-selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


##### SMART WINDOW & PANE BEHAVIOR #####
bind '%' split-window -c '#{pane_current_path}' -h  # Horizontal split in current dir
bind '"' split-window -c '#{pane_current_path}'     # Vertical split in current dir

bind c new-window -c '#{pane_current_path}'         # New window in current dir

##### WINDOW NAVIGATION #####
bind S-Left swap-window -t -1 \; select-window -t -1
bind S-Right swap-window -t +1 \; select-window -t +1

##### TMUX SESSIONIZER #####
bind t display-popup -E "\
  tmux list-sessions -F '#{?session_attached,,#{session_name}}' |\
  sed '/^$/d' |\
  find ~/Work ~/ -mindepth 1 -maxdepth 1 -type d |\
  fzf |\
  xargs ~/dotfiles/scripts/scripts/tmux-sessionizer"

##### SWITCH SESSIONS #####
bind e display-popup -E "\
  tmux list-sessions -F '#{?session_attached,,#{session_name}}' |\
  sed '/^$/d' |\
  fzf --reverse --header='Change to tmux session' |\
  xargs tmux switch-client -t"


##### KILL SESSION SELECTOR #####
bind K display-popup -E "\
  tmux list-sessions -F '#{session_name}' |\
  sed '/^$/d' |\
  fzf --reverse --header='KILL SESSION' |\
  xargs tmux kill-session -t"

##### MOVE CURRENT WINDOW TO ANOTHER SESSION #####
bind m display-popup -E "\
  tmux list-sessions -F '#{session_name}' |\
  fzf --reverse --header='Move window to session' |\
  xargs -r -I {} tmux move-window -t {}"

##### COPY MODE & VISUALS #####
set -g mode-style "fg=#282c34 bg=#ffffff"
set-option -wg copy-mode-match-style "fg=#000000,bg=#ffe082"
set-option -wg copy-mode-current-match-style "fg=#000000,bg=#f2a57e,bold"
set-option -wg copy-mode-mark-style "fg=#282c34,bg=#ffffff"

##### MISC KEYBINDS #####
bind C-l send-keys 'C-l'  # Clear screen

##### STATUS BAR (Ghostty Default) #####
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 1
set -g status-style "fg=#c5c8c6 bg=#282c34"

# Left: session name, subtle prefix highlight
set -g status-left-length 40
set -g status-left "#[fg=#ffffff,bold]#{?client_prefix,#[bg=#1d1f21 fg=#7aa6da],} #S #[bg=#282c34] "

# Window status
set -g window-status-format "#[fg=#c5c8c6] #I:#W#{?window_activity_flag, 󱅫,}#{?window_marked_flag, 󰃃,} "
set -g window-status-current-format "#[fg=#7aa6da,bold,bg=#1d1f21] #I:#W#{?window_zoomed_flag, 󰁌,}#{?window_marked_flag, 󰃃,} "
set -g window-status-separator " "
set -g window-status-activity-style none
set -g window-status-bell-style none

# Right: git · time · user
set -g status-right-length 120
set -g status-right "#[fg=#7aa6da] #(cd #{pane_current_path} && git rev-parse --abbrev-ref HEAD 2>/dev/null || echo '') #[fg=#666666]· #[fg=#c5c8c6] #(date +'%H:%M') #[fg=#666666]· #[fg=#c5c8c6] #(whoami) "
